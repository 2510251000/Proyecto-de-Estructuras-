<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Noticia</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: #f4f1eb;
            color: #1a1a1a;
            min-height: 100vh;
        }

        header {
            background: #1a1a1a;
            color: #f4f1eb;
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #c8a94a;
        }

        header h1 { font-size: 2rem; letter-spacing: 2px; text-transform: uppercase; }

        header a {
            color: #c8a94a;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        header a:hover { color: #e0c060; }

        main { max-width: 680px; margin: 50px auto; padding: 0 20px; }

        .formulario-card {
            background: #fff;
            padding: 36px 40px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            border-top: 5px solid #c8a94a;
        }

        .formulario-card h2 {
            font-size: 1.4rem;
            margin-bottom: 28px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ddd;
            letter-spacing: 1px;
        }

        label {
            display: block;
            font-family: Arial, sans-serif;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 6px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            font-family: Georgia, serif;
            font-size: 1rem;
            color: #1a1a1a;
            background: #fafafa;
            margin-bottom: 22px;
            outline: none;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #c8a94a;
            background: #fff;
        }

        textarea { resize: vertical; min-height: 140px; }

        button[type="submit"] {
            background: #1a1a1a;
            color: #fff;
            border: none;
            padding: 14px 28px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            width: 100%;
        }

        button[type="submit"]:hover { background: #333; }
        button[type="submit"]:disabled { background: #999; cursor: not-allowed; }

        #mensaje {
            margin-top: 16px;
            padding: 12px 16px;
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
            display: none;
        }

        #mensaje.exito { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        #mensaje.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <header>
        <h1>📰 Portal de Noticias</h1>
        <a href="index.html">← Volver a la lista</a>
    </header>

    <main>
        <div class="formulario-card">
            <h2>Nueva Noticia</h2>
            <form id="formulario" novalidate>
                <label for="titulo">Título</label>
                <input type="text" id="titulo" placeholder="Escribe el título de la noticia">

                <label for="contenido">Contenido</label>
                <textarea id="contenido" placeholder="Escribe el contenido de la noticia..."></textarea>

                <button type="submit" id="btnGuardar">Publicar noticia</button>
            </form>
            <div id="mensaje"></div>
        </div>
    </main>

    <script>
        var API = 'http://localhost:8000/backend/api/noticias.php';

        function mostrarMensaje(texto, tipo) {
            var el = document.getElementById('mensaje');
            el.textContent = texto;
            el.className = tipo;
            el.style.display = 'block';
        }

        document.getElementById('formulario').addEventListener('submit', function(evento) {
            evento.preventDefault();

            var titulo = document.getElementById('titulo').value.trim();
            var contenido = document.getElementById('contenido').value.trim();
            var btn = document.getElementById('btnGuardar');

            // Validación antes de enviar
            if (titulo === '') {
                mostrarMensaje('El título no puede estar vacío.', 'error');
                document.getElementById('titulo').focus();
                return;
            }

            if (contenido === '') {
                mostrarMensaje('El contenido no puede estar vacío.', 'error');
                document.getElementById('contenido').focus();
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Publicando...';

            fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titulo: titulo, contenido: contenido })
            })
            .then(function(respuesta) {
                if (!respuesta.ok) throw new Error('Error ' + respuesta.status);
                return respuesta.json();
            })
            .then(function(data) {
                mostrarMensaje('✓ ' + (data.mensaje || 'Noticia creada correctamente.'), 'exito');
                document.getElementById('formulario').reset();
            })
            .catch(function(error) {
                mostrarMensaje('Error al conectar con el servidor. Verifica que esté corriendo.', 'error');
                console.error(error);
            })
            .finally(function() {
                btn.disabled = false;
                btn.textContent = 'Publicar noticia';
            });
        });
    </script>

</body>
</html>
